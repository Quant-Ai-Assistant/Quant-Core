<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>Set up Quant</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <header class="titlebar">
      <span class="titlebar-name">Quant</span>
      <button id="quit" class="titlebar-quit" type="button" title="Quit Quant">Quit</button>
    </header>

    <main class="shell">
      <form id="setup" novalidate>
        <p id="step-count" class="step-count"></p>

        <section id="step-choose" class="step">
          <h1 class="heading">Where will Quant run?</h1>
          <fieldset class="choices">
            <legend class="sr-only">Instance</legend>

            <label class="choice" for="mode-new">
              <input id="mode-new" type="radio" name="mode" value="new" checked />
              <span>
                <span class="choice-title">This computer</span>
                <span class="choice-hint">Server inside the app</span>
              </span>
            </label>

            <label class="choice" for="mode-existing">
              <input id="mode-existing" type="radio" name="mode" value="existing" />
              <span>
                <span class="choice-title">Another server</span>
                <span class="choice-hint">Connect by address</span>
              </span>
            </label>
          </fieldset>
        </section>

        <section id="step-access" class="step" hidden>
          <h1 class="heading">Sign-in from other devices</h1>
          <label class="field-label" for="gate-username">Username</label>
          <input
            id="gate-username"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="quant"
          />
          <label class="field-label" for="gate-password">Password</label>
          <input id="gate-password" class="field" type="password" autocomplete="new-password" />
          <p class="field-hint">Phones and browsers ask for these when they connect.</p>
        </section>

        <section id="step-port" class="step" hidden>
          <h1 class="heading">Port</h1>
          <label class="field-label" for="gate-port">Port</label>
          <input
            id="gate-port"
            class="field field-port"
            type="text"
            inputmode="numeric"
            spellcheck="false"
            autocomplete="off"
          />
          <p id="gate-address" class="field-hint"></p>
        </section>

        <section id="step-install" class="step" hidden>
          <h1 class="heading">Installing Quant</h1>
          <div class="stack-head">
            <p id="stack-phase" class="stack-phase" role="status" aria-live="polite"></p>
            <button
              id="stack-details"
              class="icon-button"
              type="button"
              aria-controls="stack-output"
              aria-expanded="false"
              aria-label="Technical details"
              title="Technical details"
            >
              <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
                <path d="M3.5 4.5 7 8l-3.5 3.5M8.5 11.5H13" />
              </svg>
            </button>
          </div>
          <div
            id="stack-progress"
            class="progress"
            role="progressbar"
            aria-label="Setup progress"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
            hidden
          >
            <div id="stack-progress-fill" class="progress-fill"></div>
          </div>
          <p id="install-address" class="field-hint"></p>
          <pre id="stack-output" class="stack-output" hidden></pre>
        </section>

        <section id="step-existing" class="step" hidden>
          <h1 class="heading">Connect to a server</h1>
          <label class="field-label" for="server-url">Server address</label>
          <input
            id="server-url"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://192.168.1.10:8080"
          />
          <label class="field-label" for="server-username">Username (if the server asks)</label>
          <input
            id="server-username"
            class="field"
            type="text"
            spellcheck="false"
            autocomplete="username"
          />
          <label class="field-label" for="server-password">Password</label>
          <input id="server-password" class="field" type="password" autocomplete="current-password" />
        </section>

        <p id="status" class="status" role="status" aria-live="polite"></p>

        <div class="actions">
          <button id="back" class="button button-secondary actions-back" type="button" hidden>
            Back
          </button>
          <button id="check" class="button button-secondary" type="button" hidden>
            Check connection
          </button>
          <button id="continue" class="button button-primary" type="submit">Next</button>
        </div>
      </form>
    </main>

    <script src="setup.js"></script>
  </body>
</html>
